name: build-ios

# 在 GitHub 的 macOS 机器上出一个**未签名** IPA，再由 SideStore 在 iPad 上用
# 你自己的 Apple ID 重签安装。没有 Mac 也能走通这条路。
#
# 关键约束（都在本地用真实的 Capacitor 模板验证过）：
#   · Capacitor 7 的 `cap add ios` 默认生成 SPM 工程（App.xcodeproj + CapApp-SPM），
#     **没有 Podfile / App.xcworkspace**，所以不能无条件 pod install / -workspace
#   · 模板的 Info.plist 里没有 UIStatusBarHidden / UIRequiresFullScreen，
#     `plutil -replace` 会报错 —— 补丁脚本改用 python plistlib
#   · 模板的 AppDelegate 是 `@UIApplicationMain` + `return true`，
#     没有 `super.application(...)` 这个锚点

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14          # Xcode 15.x，满足模板要求 swift-tools-version 5.9
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 检查素材
        run: |
          set -e
          test -f library/manifest.json || { echo "❌ 缺少 library/manifest.json"; exit 1; }
          test -f app/package-lock.json || { echo "❌ 缺少 package-lock.json"; exit 1; }
          echo "书籍数: $(python3 -c "import json;print(len(json.load(open('library/manifest.json'))['books']))")"
          du -sh library

      - name: 安装依赖
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: 组装 www
        working-directory: app
        run: |
          node scripts/build-www.mjs
          test -f www/index.html || { echo "❌ www/index.html 不存在"; exit 1; }
          test -f www/library/manifest.json || { echo "❌ www 里没有 library"; exit 1; }
          du -sh www

      - name: 生成 / 同步 iOS 工程
        working-directory: app
        run: |
          set -e
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          test -d ios/App/App || { echo "❌ ios/App/App 不存在"; exit 1; }

      - name: 打原生补丁（横屏 / 状态栏 / 音频会话）
        working-directory: app
        run: node scripts/patch-ios.mjs

      - name: 解析依赖（SPM 或 CocoaPods，按工程实际形态）
        working-directory: app/ios/App
        run: |
          set -e
          if [ -f Podfile ]; then
            echo "形态: CocoaPods"
            pod install --repo-update
            echo "XCODE_TARGET=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          else
            echo "形态: SPM"
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
            echo "XCODE_TARGET=-project App.xcodeproj" >> "$GITHUB_ENV"
          fi

      - name: 未签名构建
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild $XCODE_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log | tail -60

      - name: 打包 IPA
        working-directory: app/ios/App
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          test -n "$APP" || { echo "❌ 没找到 .app"; tail -100 xcodebuild.log; exit 1; }
          # Capacitor 把 webDir 拷到 App.app/public/
          test -d "$APP/public" || { echo "❌ 包里没有 public/"; exit 1; }
          test -f "$APP/public/library/manifest.json" || { echo "❌ 包里没有 library"; exit 1; }
          du -sh "$APP" "$APP/public"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../gk-reader-unsigned.ipa Payload
          ls -lh ../gk-reader-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gk-reader-ipa
          path: app/ios/gk-reader-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 失败时留下日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/ios/App/xcodebuild.log
            app/ios/App/build/Logs
          if-no-files-found: ignore
          retention-days: 7
