name: build-ios

# 在 GitHub 的 macOS 机器上出一个**未签名** IPA，再由 SideStore 在 iPad 上用
# 你自己的 Apple ID 重签安装。没有 Mac 也能走通这条路。
#
# 事实核对（用 `npx cap add ios` 的真实产物验过，不是猜）：
#   · Capacitor 7 的 `cap add ios` 默认生成 **CocoaPods** 工程
#     （有 Podfile + App.xcworkspace；SPM 模板只有手动指定才用）
#   · 模板的 Info.plist **没有** UIStatusBarHidden / UIRequiresFullScreen，
#     `plutil -replace` 会报错 —— 补丁改用 python plistlib
#   · 模板的 AppDelegate 是 `@UIApplicationMain` + `return true`，
#     **没有** `super.application(...)` 锚点
#   · 模板不带 .xcscheme，`-scheme App` 可能找不到 —— 见"准备 scheme"步骤

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    # macOS 14 镜像已于 2026-11-02 退役，必须用 15 及以上
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 先不拉 LFS：library 有 247 MB，每次 checkout 都拉会吃掉每月 1 GB 的
          # LFS 流量（约 4 次构建就没了）。改成"缓存命中就不拉"。
          lfs: false

      - name: 还原 library（缓存优先）
        uses: actions/cache@v4
        with:
          path: library
          # 缓存键跟着 manifest + 所有 book.json 的 LFS 指针走：
          # 内容不变就一直命中；资源一变就自动失效。
          key: library-${{ hashFiles('library/manifest.json', 'library/books/**/*.json') }}

      - name: 必要时从 LFS 拉取 library（会消耗流量）
        run: |
          set -e
          # LFS 指针文件以 "version https://git-lfs" 开头；真 JSON 以 { 开头
          if head -c 64 library/manifest.json | grep -q '^{'; then
            echo "✓ 缓存命中，library 已是真实文件"
          else
            echo "→ 缓存未命中，从 LFS 拉取 library/（本次会消耗约 247 MB 流量）"
            rm -rf library
            git lfs pull --include="library/**"
          fi
          head -c 64 library/manifest.json | grep -q '^{' \
            || { echo "❌ library/manifest.json 仍是 LFS 指针，资源没拉到"; exit 1; }
          du -sh library

      - name: 拉取图标素材（很小，每次都拉）
        run: |
          if head -c 64 app/resources/icon.png | grep -q 'version https://git-lfs'; then
            git lfs pull --include="app/resources/**"
          fi
          file app/resources/icon.png | grep -qi 'PNG' \
            || { echo "❌ 图标素材不是有效 PNG"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 环境留证
        run: |
          xcodebuild -version
          pod --version || true
          node -v && npm -v
          sw_vers

      - name: 检查素材
        run: |
          set -e
          test -f library/manifest.json || { echo "❌ 缺少 library/manifest.json"; exit 1; }
          test -f app/package-lock.json || { echo "❌ 缺少 package-lock.json"; exit 1; }
          test -f app/resources/icon.png || { echo "❌ 缺少 app/resources/icon.png"; exit 1; }
          echo "书籍数: $(python3 -c "import json;print(len(json.load(open('library/manifest.json'))['books']))")"
          du -sh library

      - name: 安装依赖
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: 组装 www
        working-directory: app
        run: |
          node scripts/build-www.mjs
          test -f www/index.html || { echo "❌ www/index.html 不存在"; exit 1; }
          test -f www/library/manifest.json || { echo "❌ www 里没有 library"; exit 1; }
          du -sh www

      - name: 生成 / 同步 iOS 工程
        working-directory: app
        run: |
          set -e
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          test -d ios/App/App || { echo "❌ ios/App/App 不存在"; exit 1; }
          ls -la ios/App | head -20

      - name: 打原生补丁（横屏 / 状态栏 / 音频会话）
        working-directory: app
        run: node scripts/patch-ios.mjs

      - name: 生成图标与启动图
        working-directory: app
        run: npm run assets || echo "⚠ 图标生成失败，继续用模板默认图标"

      - name: 解析依赖（SPM 或 CocoaPods，按工程实际形态）
        working-directory: app/ios/App
        run: |
          set -e
          if [ -f Podfile ]; then
            echo "形态: CocoaPods"
            pod install
            echo "XCODE_TARGET=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          else
            echo "形态: SPM"
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
            echo "XCODE_TARGET=-project App.xcodeproj" >> "$GITHUB_ENV"
          fi

      - name: 准备 scheme（模板不自带，尽量补）
        working-directory: app/ios/App
        run: |
          echo "--- 现有 scheme ---"
          xcodebuild -list $XCODE_TARGET 2>&1 | tee /tmp/list.txt || true
          sed -n '/Schemes:/,/^$/p' /tmp/list.txt || true
          if grep -qE '^\s+App\s*$' /tmp/list.txt; then
            echo "✓ 已有 App scheme"
          else
            echo "→ 未列出 App scheme，尝试生成共享 scheme"
            ruby -e '
              require "xcodeproj"
              p = Xcodeproj::Project.open("App.xcodeproj")
              p.recreate_user_schemes
              p.save
              Xcodeproj::XCScheme.share_scheme(".", "App")
            ' || echo "⚠ ruby 生成失败（不中断，交给 xcodebuild 自动推断）"
            xcodebuild -list $XCODE_TARGET 2>&1 | sed -n '/Schemes:/,/^$/p' || true
          fi

      - name: 未签名构建
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild $XCODE_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log | tail -60

      - name: 打包 IPA
        working-directory: app/ios/App
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          test -n "$APP" || { echo "❌ 没找到 .app"; tail -100 xcodebuild.log; exit 1; }
          # Capacitor 把 webDir 拷到 App.app/public/
          test -d "$APP/public" || { echo "❌ 包里没有 public/"; exit 1; }
          test -f "$APP/public/library/manifest.json" || { echo "❌ 包里没有 library"; exit 1; }
          du -sh "$APP" "$APP/public"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../gk-reader-unsigned.ipa Payload
          ls -lh ../gk-reader-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gk-reader-ipa
          path: app/ios/gk-reader-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 失败时留下日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/ios/App/xcodebuild.log
            app/ios/App/build/Logs
          if-no-files-found: ignore
          retention-days: 7
