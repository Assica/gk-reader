name: build-ios

# 在 GitHub 的 macOS 机器上出一个**未签名** IPA，再由 SideStore 在 iPad 上用
# 你自己的 Apple ID 重签安装。没有 Mac 也能走通这条路。
#
# 每条设计都对应一个踩过的坑（都在本地用真实 Capacitor 模板验证过）：
#   · cap add ios 默认生成 CocoaPods 工程（有 Podfile + App.xcworkspace）
#   · 模板 Info.plist 没有 UIStatusBarHidden / UIRequiresFullScreen，plutil -replace 会报错
#   · 模板 AppDelegate 没有 super.application 锚点
#   · 模板**不带 .xcscheme**，-scheme App 会失败 → 自己写一份共享 scheme
#   · library 有 247 MB，留在仓库里会同时吃 LFS 存储、LFS 带宽和 Actions 缓存 →
#     现已移到 Release 附件（tag: library-data-v1），CI 用 API 下载解压
#   · 探针必须用 .jpg：manifest.json 的字节不像 LFS 指针，用它当探针会永远判"已还原"
#   · 私有仓库 macOS 按 10 倍计费，artifact 存储 0.5 GB

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15          # macOS 14 镜像已于 2026-11-02 退役
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # library 已移出仓库，只剩 app/resources 的小图还在 LFS（下一步单独拉）
          lfs: false

      - name: 下载 library（Release 附件，不走 LFS）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRARY_TAG: library-data-v1
        run: |
          set -e
          # 私有仓库的 Release 附件必须走 API：先取 asset 的 url，再按 octet-stream 取二进制。
          # 换资源包时：发一个新 tag（library-data-v2 …），改这里的 LIBRARY_TAG 即可。
          ASSET_URL=$(curl -sSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${LIBRARY_TAG}" \
            | python3 -c "import json,sys; a=[x for x in json.load(sys.stdin)['assets'] if x['name']=='library.zip'][0]; print(a['url'])")
          test -n "$ASSET_URL" || { echo "❌ 找不到附件 library.zip（tag ${LIBRARY_TAG}）"; exit 1; }
          echo "asset = $ASSET_URL"
          # 旧版的坑：这里千万别只 rm -rf 不重新解压，也别忘了 library 里还有
          # manifest.json / books/*.json 这类非 LFS 文件——现在整个目录都来自附件。
          rm -rf library && mkdir -p library
          curl -sSL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o /tmp/library.zip
          unzip -q /tmp/library.zip -d library
          rm -f /tmp/library.zip

      - name: 校验 library
        run: |
          set -e
          PROBE=library/covers/GK/001.jpg
          test -f library/manifest.json || { echo "❌ 缺少 library/manifest.json"; exit 1; }
          test -f "$PROBE" || { echo "❌ 缺少 $PROBE"; exit 1; }
          LIB_MB=$(du -sm library | cut -f1)
          echo "library = ${LIB_MB} MB"
          [ "$LIB_MB" -ge 200 ] || { echo "❌ library 只有 ${LIB_MB} MB（应 ≥200）"; exit 1; }
          file "$PROBE" | grep -qi 'JPEG' || { echo "❌ 探针不是有效 JPEG，附件内容可能不对"; exit 1; }
          BOOKS=$(python3 -c "import json;print(len(json.load(open('library/manifest.json'))['books']))")
          echo "书籍数 = $BOOKS"
          [ "$BOOKS" -ge 180 ] || { echo "❌ 书籍数 $BOOKS < 180"; exit 1; }

      - name: 还原图标素材（很小，每次都拉）
        run: |
          set -e
          if head -c 64 app/resources/icon.png | grep -q 'version https://git-lfs'; then
            git lfs pull --include="app/resources/**"
          fi
          file app/resources/icon.png | grep -qi 'PNG' || { echo "❌ 图标不是 PNG"; exit 1; }
          file app/resources/splash.png | grep -qi 'PNG' || { echo "❌ 启动图不是 PNG"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 环境留证
        run: |
          xcodebuild -version
          pod --version || true
          node -v && npm -v
          git lfs version || true
          sw_vers

      - name: 检查素材
        run: |
          set -e
          test -f library/manifest.json || { echo "❌ 缺少 library/manifest.json"; exit 1; }
          test -f app/package-lock.json || { echo "❌ 缺少 package-lock.json"; exit 1; }
          BOOKS=$(python3 -c "import json;print(len(json.load(open('library/manifest.json'))['books']))")
          echo "书籍数: $BOOKS"
          [ "$BOOKS" -ge 180 ] || { echo "❌ 书籍数 $BOOKS < 180"; exit 1; }

      - name: 安装依赖
        working-directory: app
        # 依赖树里已经没有带 install 脚本的包（sharp 已移除），跨平台安全
        run: npm ci --no-audit --no-fund

      - name: 组装 www
        working-directory: app
        run: |
          set -e
          node scripts/build-www.mjs
          test -f www/index.html || { echo "❌ www/index.html 不存在"; exit 1; }
          test -f www/library/manifest.json || { echo "❌ www 里没有 library"; exit 1; }
          WWW_MB=$(du -sm www | cut -f1)
          echo "www = ${WWW_MB} MB"
          [ "$WWW_MB" -ge 240 ] || { echo "❌ www 只有 ${WWW_MB} MB（应 ≥240）"; exit 1; }

      - name: 生成 / 同步 iOS 工程
        working-directory: app
        run: |
          set -e
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          test -d ios/App/App || { echo "❌ ios/App/App 不存在"; exit 1; }
          test -f ios/App/App/public/library/manifest.json || { echo "❌ public 里没有 library"; exit 1; }
          du -sh ios/App/App/public

      - name: 打原生补丁（横屏 / 状态栏 / 音频会话）
        working-directory: app
        run: node scripts/patch-ios.mjs

      - name: 生成共享 scheme（模板不带）
        working-directory: app
        run: |
          set -e
          python3 scripts/make_scheme.py ios/App
          test -f ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme \
            || { echo "❌ scheme 没写出来"; exit 1; }

      - name: 图标与启动图（纯拷贝，不用 sharp）
        run: |
          set -e
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          SPL=ios/App/App/Assets.xcassets/Splash.imageset
          cp app/resources/icon.png "$ICON"
          for n in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do
            cp app/resources/splash.png "$SPL/$n"
          done
          file "$ICON" | grep -qi 'PNG' || { echo "❌ 图标拷贝失败"; exit 1; }
          ls -l "$ICON" "$SPL"

      - name: 解析依赖（CocoaPods / SPM 按实际形态）
        working-directory: app/ios/App
        run: |
          set -e
          if [ -f Podfile ]; then
            echo "形态: CocoaPods"
            pod install
            echo "XCODE_TARGET=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          else
            echo "形态: SPM"
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
            echo "XCODE_TARGET=-project App.xcodeproj" >> "$GITHUB_ENV"
          fi

      - name: 确认 scheme 可用（不信人读格式，直接解析 JSON）
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -list -json $XCODE_TARGET > /tmp/list.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/list.json'))
          info = d.get('project') or d.get('workspace') or {}
          schemes = info.get('schemes', [])
          print('schemes =', schemes)
          assert 'App' in schemes, "缺少 App scheme"
          print('✓ scheme 检查通过')
          PY

      - name: 未签名构建
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild $XCODE_TARGET \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee xcodebuild.log | tail -60

      - name: 打包 IPA
        working-directory: app/ios/App
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          test -n "$APP" || { echo "❌ 没找到 .app"; tail -100 xcodebuild.log; exit 1; }
          test -d "$APP/public" || { echo "❌ 包里没有 public/"; exit 1; }
          test -f "$APP/public/library/manifest.json" || { echo "❌ 包里没有 library"; exit 1; }
          PUB_MB=$(du -sm "$APP/public" | cut -f1)
          echo "public = ${PUB_MB} MB"
          [ "$PUB_MB" -ge 240 ] || { echo "❌ public 只剩 ${PUB_MB} MB（应为真实资源，检查 Release 附件是否下全）"; exit 1; }
          du -sh "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qryX ../gk-reader-unsigned.ipa Payload
          ls -lh ../gk-reader-unsigned.ipa

      - name: 校验 IPA 结构（失败不拦构建，只出诊断）
        working-directory: app/ios
        run: |
          python3 ../../tools/verify_ipa.py gk-reader-unsigned.ipa \
            --expect-bundle-id com.gkreader.app --expect-books 180 \
            --min-library-mb 240 --min-files 1900 || echo "⚠ 自检未全部通过，请看上面输出"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gk-reader-ipa
          path: app/ios/gk-reader-unsigned.ipa
          if-no-files-found: error
          retention-days: 7        # 私有仓库只有 0.5 GB 存储，255 MB 的包留 30 天必爆

      - name: 失败时留下日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/ios/App/xcodebuild.log
            app/ios/App/build/Logs
          if-no-files-found: ignore
          retention-days: 7
